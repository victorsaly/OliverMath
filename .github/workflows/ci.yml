name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
        continue-on-error: true  # Allow JS files for now

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Started here rather than by the Cypress action, so that when the
      # server does not come up the log says why instead of only
      # "Socket closed before the connection was established".
      - name: Start the preview server
        run: |
          npm run preview -- --port 8100 --host 0.0.0.0 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8100/OliverMath/; then
              echo "Preview server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not start:"
          cat preview.log
          exit 1

      - name: E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npm run test:e2e

# Deployment lives in deploy.yml, which publishes through GitHub Pages' own
# workflow source. A second deploy job here pushed the same build to a gh-pages
# branch that nothing serves.
