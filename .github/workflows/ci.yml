name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
        continue-on-error: true  # Allow JS files for now

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E tests
        uses: cypress-io/github-action@v6
        with:
          # Listen on every address and wait on IPv4. Left to "localhost", the
          # server bound to IPv6 only while the check tried IPv4 and gave up
          # with "Socket closed before the connection was established".
          start: npm run preview -- --port 8100 --host 0.0.0.0
          wait-on: 'http://127.0.0.1:8100'
          wait-on-timeout: 60
          command: npm run test:e2e

# Deployment lives in deploy.yml, which publishes through GitHub Pages' own
# workflow source. A second deploy job here pushed the same build to a gh-pages
# branch that nothing serves.
