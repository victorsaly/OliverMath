<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Oliver Math">
  <!-- Brand tile -->
  <rect width="64" height="64" rx="14" fill="#1f63d6"/>

  <!-- Calculator body. Gold on brand blue, matching the wordmark. -->
  <rect x="15" y="10" width="34" height="44" rx="5" fill="#ffd700"/>

  <!-- Display -->
  <rect x="20" y="15" width="24" height="10" rx="2.5" fill="#16213e"/>

  <!-- Keys: three columns, three rows -->
  <g fill="#16213e">
    <rect x="20" y="30" width="6" height="6" rx="1.6"/>
    <rect x="29" y="30" width="6" height="6" rx="1.6"/>
    <rect x="38" y="30" width="6" height="6" rx="1.6"/>

    <rect x="20" y="39" width="6" height="6" rx="1.6"/>
    <rect x="29" y="39" width="6" height="6" rx="1.6"/>
    <rect x="38" y="39" width="6" height="6" rx="1.6"/>

    <rect x="20" y="48" width="15" height="6" rx="1.6"/>
    <rect x="38" y="48" width="6" height="6" rx="1.6"/>
  </g>
</svg>
